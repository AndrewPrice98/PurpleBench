[project]
name = "purplebench"
version = "0.1.0"
description = "PurpleBench: purple-team detection validation for Windows (Atomic Red Team tests against Sigma rules)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# starlette 1.x warns that its TestClient will move to httpx2; the dependency set is fixed for now.
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]
