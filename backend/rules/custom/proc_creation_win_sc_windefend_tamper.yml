title: Microsoft Defender Service Stopped Or Reconfigured With Sc.exe
id: 43269c66-3d33-4049-8192-a9f13805a54e
status: experimental
description: Detects sc.exe stopping, deleting or reconfiguring the WinDefend service.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1685/T1685.md
author: Andrew T. Price II
date: 2026-11-10
tags:
    - attack.defense-impairment
    - attack.t1685
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\sc.exe'
        - OriginalFileName: 'sc.exe'
    selection_service:
        CommandLine|contains: 'WinDefend'
    selection_action:
        CommandLine|contains:
            - ' stop '
            - ' config '
            - ' delete '
    condition: all of selection_*
falsepositives:
    - Troubleshooting by administrators
level: high
license: DRL-1.1
