title: Local Account Created With PowerShell New-LocalUser
id: fb902c61-a077-478a-8c06-8e0a425a54fa
status: experimental
description: |
    Detects New-LocalUser on a PowerShell command line. SigmaHQ covers this cmdlet with a script
    block (event 4104) rule; this process-creation version works where script block logging is not
    collected.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1136.001/T1136.001.md
author: Andrew T. Price II
date: 2026-11-10
tags:
    - attack.persistence
    - attack.t1136.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith:
              - '\powershell.exe'
              - '\pwsh.exe'
        - OriginalFileName:
              - 'PowerShell.EXE'
              - 'pwsh.dll'
    selection_cmd:
        CommandLine|contains: 'New-LocalUser'
    condition: all of selection_*
falsepositives:
    - Provisioning scripts
level: medium
license: DRL-1.1
