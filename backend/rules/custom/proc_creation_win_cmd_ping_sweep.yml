title: Ping Sweep From A Command Shell Loop
id: fbd8e0d5-3bf6-4dc3-94c8-36a4591c55b2
status: experimental
description: Detects a cmd.exe "for /l" loop that runs ping against a range of addresses.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1018/T1018.md
author: Andrew T. Price II
date: 2026-11-10
tags:
    - attack.discovery
    - attack.t1018
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\cmd.exe'
        CommandLine|windash|contains|all:
            - 'for /l'
            - 'ping'
    condition: selection
falsepositives:
    - Network troubleshooting scripts
level: medium
license: DRL-1.1
