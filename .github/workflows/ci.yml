name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Tests
        working-directory: backend
        run: python -m pytest -q
      # Validates data/telemetry/manifest.json (hashes, counts, windows) and the technique library.
      - name: Technique catalog is current
        working-directory: backend
        run: python -m purplebench catalog --check
      # Rebuilds the demo runs with the real evaluator and compares with data/demo_fixture.json.
      - name: Demo fixture is current
        working-directory: backend
        run: python scripts/build_demo.py --check

  # Parses the lab runner with the PowerShell AST and fails on parse errors, download or dynamic-execution
  # commands, or an Invoke-Command that is not bound to the single target session. Never runs the runner.
  lab-script:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lab runner static check (Windows PowerShell 5.1)
        shell: powershell
        run: ./lab/Test-RunnerStatic.ps1
      - name: Lab runner static check (PowerShell 7)
        shell: pwsh
        run: ./lab/Test-RunnerStatic.ps1

  frontend:
    # Placeholder until the frontend scaffold lands in a later task.
    if: hashFiles('package.json') != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt

  secrets:
    runs-on: ubuntu-latest
    # gitleaks-action v2 lists a pull request's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
