name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Tests
        working-directory: backend
        # -rs names every skipped test (on Linux the tests that need PowerShell are skipped).
        run: python -m pytest -q -rs
      # Validates data/telemetry/manifest.json (hashes, counts, windows) and the technique library.
      - name: Technique catalog is current
        working-directory: backend
        run: python -m purplebench catalog --check
      # docs/COVERAGE.md is generated from the rules and the demo fixture.
      - name: Generated docs are current
        working-directory: backend
        run: python -m purplebench docs --check
      # Rebuilds the demo runs with the real evaluator and compares with data/demo_fixture.json.
      - name: Demo fixture is current
        working-directory: backend
        run: python -m purplebench demo --check

  # Parses the lab runner with the PowerShell AST and fails on parse errors, forbidden commands (download, dynamic
  # execution, log clearing, security-tool tampering, destructive disk or file commands), or a missing safety gate
  # (allow-list, LabTarget marker, typed confirmation, -Credential refusal). Never runs the runner. The self-test
  # proves the checker fails on a forbidden command and on each removed gate.
  lab-script:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lab runner static check (Windows PowerShell 5.1)
        shell: powershell
        run: ./lab/Test-RunnerStatic.ps1
      - name: Static checker self-test (Windows PowerShell 5.1)
        shell: powershell
        run: ./lab/Test-RunnerStatic.SelfTest.ps1
      - name: Lab runner static check (PowerShell 7)
        shell: pwsh
        run: ./lab/Test-RunnerStatic.ps1
      - name: Static checker self-test (PowerShell 7)
        shell: pwsh
        run: ./lab/Test-RunnerStatic.SelfTest.ps1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  # Browser smoke test (guest read-only, one page per area) with the runner's own Chrome. Non-blocking: it checks
  # the browser path, and a Chrome or runner change should not block an unrelated fix.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: pip install -r backend/requirements.txt
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: e2e
      - name: Start the demo API and the built UI
        run: |
          (cd backend && python -m purplebench demo --serve --port 8765 --db "$RUNNER_TEMP/e2e.db" > "$RUNNER_TEMP/api.log" 2>&1 &)
          (PURPLEBENCH_API_URL=http://127.0.0.1:8765 npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/ui.log" 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/api/health && break; sleep 1; done
      - name: Smoke test
        working-directory: e2e
        run: node smoke.mjs

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt
      - name: Audit root requirements (Vercel function)
        run: pip-audit -r requirements.txt
      - name: Audit e2e dependencies
        run: npm audit --audit-level=high --prefix e2e

  secrets:
    runs-on: ubuntu-latest
    # gitleaks-action v2 lists a pull request's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
